[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compas_fab_tesseract"
version = "0.1.0"
description = "Tesseract motion planning backend for compas_fab"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jelle Feringa", email = "jelleferinga@gmail.com"},
]
maintainers = [
    {name = "Jelle Feringa", email = "jelleferinga@gmail.com"},
]
keywords = [
    "robotics",
    "motion-planning",
    "compas",
    "compas_fab",
    "tesseract",
    "ompl",
    "trajopt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "compas>=2.0",
    "compas_fab>=1.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "ruff",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "myst-parser",
]

[project.urls]
Homepage = "https://github.com/compas-dev/compas_fab_tesseract"
Documentation = "https://compas-dev.github.io/compas_fab_tesseract"
Repository = "https://github.com/compas-dev/compas_fab_tesseract"
Issues = "https://github.com/compas-dev/compas_fab_tesseract/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
