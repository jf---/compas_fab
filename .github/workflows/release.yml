on:
  push:
    tags:
      - 'v*'

name: Create Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        exclude:
          - os: ubuntu-latest
            python: '3.9'

    steps:
      - uses: compas-dev/compas-actions.build@v5
        env:
          CFLAGS: ${{ startsWith(matrix.os, 'macos') && '-fno-define-target-os-macros' || '' }}
        with:
          python: ${{ matrix.python }}
          invoke_lint: true

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout repo for Grasshopper preflight
        uses: actions/checkout@v6

      - name: Install Rhino 8 CPython environment
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: rhino39
          locked: true

      - name: Create CPython Grasshopper user objects
        run: |
          pixi run -e rhino39 build-gh-components

      - name: Require Tesseract Grasshopper user objects
        shell: pwsh
        run: |
          $target = "src/compas_fab/ghpython/components_cpython/ghuser"
          $required = @(
            "Cf_TesseractRobotArtifact.ghuser",
            "Cf_TesseractPlanner.ghuser",
            "Cf_TesseractRapidProfile.ghuser",
            "Cf_TesseractRapid.ghuser"
          )
          foreach ($name in $required) {
            $path = Join-Path $target $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing compiled Grasshopper user object: $path"
            }
          }

      - name: Pin Rhino 8 CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - uses: compas-dev/compas-actions.publish@v3
        with:
          pypi_token: ${{ secrets.PYPI_PASSWORD }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_ghpython_components: true
          gh_source: src/compas_fab/ghpython/components_cpython
          gh_target: src/compas_fab/ghpython/components_cpython/ghuser
          gh_prefix: "COMPAS FAB: "
          gh_interpreter: "cpython"
          release_name_prefix: COMPAS FAB
