name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
        exclude:
          - os: ubuntu-latest
            python: '3.9'

    steps:
      - uses: compas-dev/compas-actions.build@v5
        env:
          CFLAGS: ${{ startsWith(matrix.os, 'macos') && '-fno-define-target-os-macros' || '' }}
        with:
          python: ${{ matrix.python }}
          invoke_lint: true

  build-cpython-components:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Install Rhino 8 CPython environment
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        environments: rhino39
        locked: true

    - name: Create CPython Grasshopper user objects
      run: |
        pixi run -e rhino39 build-gh-components

    - name: Require Tesseract Grasshopper user objects
      shell: pwsh
      run: |
        $target = "src/compas_fab/ghpython/components_cpython/ghuser"
        $required = @(
          "Cf_TesseractRobotArtifact.ghuser",
          "Cf_TesseractPlanner.ghuser",
          "Cf_TesseractRapidProfile.ghuser",
          "Cf_TesseractRapid.ghuser",
          "Cf_TesseractPose.ghuser",
          "Cf_TesseractCartesianTarget.ghuser",
          "Cf_TesseractJointTarget.ghuser",
          "Cf_TesseractStateTarget.ghuser",
          "Cf_TesseractMotionProgram.ghuser",
          "Cf_TesseractDescartesProfile.ghuser",
          "Cf_TesseractNativePlan.ghuser",
          "Cf_TesseractNativeResult.ghuser",
          "Cf_AbbController.ghuser",
          "Cf_AbbControllerState.ghuser",
          "Cf_AbbIoRead.ghuser",
          "Cf_AbbIoWrite.ghuser",
          "Cf_AbbStart.ghuser",
          "Cf_AbbReset.ghuser",
          "Cf_AbbStop.ghuser"
        )
        foreach ($name in $required) {
          $path = Join-Path $target $name
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Missing compiled Grasshopper user object: $path"
          }
        }

    - uses: actions/upload-artifact@v5
      with:
        name: compas_fab_components
        path: src/compas_fab/ghpython/components_cpython/ghuser
