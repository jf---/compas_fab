[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Project info
# ============================================================================

[project]
name = "compas_fab"
description = "Robotic fabrication package for the COMPAS Framework"
keywords = ["robotic fabrication", "digital fabrication", "architecture", "robotics", "ros"]
authors = [
    { name = "Gramazio Kohler Research", email = "gramaziokohler@arch.ethz.ch" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dynamic = ['optional-dependencies', 'version']
dependencies = [
    "attrs>=23,<26",
    "compas>=2.3,<3",
    "compas_robots>=1,<2",
    "platformdirs>=4,<5",
    "pyyaml>=6,<7",
    "roslibpy>=2",
    # Exact pin, never a range: these are nanobind C++ ABI wheels. A version bump can
    # change the ABI and segfault at call time rather than fail loudly at import.
    # `tests/backends/tesseract/test_install_contract.py` enforces this equality.
    "tesseract-robotics-nanobind==0.35.0.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.setuptools.dynamic]
version = { attr = "compas_fab.__version__.__version__" }
# Runtime dependencies are declared statically in `[project].dependencies` above.
# Only the `dev` extra still resolves from a requirements file.
optional-dependencies = { dev = { file = "requirements-dev.txt" } }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.urdf", "*.srdf", "*.stl", "*.dae", "*.obj", "*.ghuser"]

[project.urls]
Homepage = "https://github.com/compas-dev/compas_fab"
Documentation = "https://compas.dev/compas_fab"
Repository = "https://github.com/compas-dev/compas_fab"
Changelog = "https://github.com/compas-dev/compas_fab/blob/main/CHANGELOG.md"
Issues = "https://github.com/compas-dev/compas_fab/issues"
Forum = "https://forum.compas-framework.org/"

# ============================================================================
# Testing
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_fab"]
python_files = [
    "test_*.py",
    "tests.py",
]
addopts = "-ra --strict-markers --doctest-glob=*.md --tb=short --import-mode=importlib"
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ALLOW_UNICODE ALLOW_BYTES NUMBER"
filterwarnings = "ignore::DeprecationWarning"

# ============================================================================
# Linting and formatting
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001", "E501"]
"tasks.py" = ["I001"]
"src/compas_fab/ghpython/components_cpython/*/code.py" = ["F821", "F401"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas_fab"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# Release automation
# ============================================================================

[tool.bumpversion]
current_version = "2.0.1"
message = "Bump version to {new_version}"
commit = true
tag = true
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        -                             # dash separator for pre-release section
        (?P<pre_l>[a-zA-Z-]+)         # pre-release label
        (?P<pre_n>0|[1-9]\\d*)        # pre-release version number
    )?                                # pre-release section is optional
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.pre_l]
values = ["rc", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "src/compas_fab/__version__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
glob = "src/compas_fab/ghpython/components_cpython/**/code.py"
search = "# r: compas_fab>={current_version}"
replace = "# r: compas_fab>={new_version}"

[[tool.bumpversion.files]]
glob = "src/compas_fab/ghpython/components_cpython/**/code.py"
search = "COMPAS FAB v{current_version}"
replace = "COMPAS FAB v{new_version}"

# ============================================================================
# Pixi development environment
# ============================================================================

[[tool.mypy.overrides]]
# The abb_robot_client fork ships no py.typed marker; treat it as untyped so the
# strict gate checks our adapter's own annotations without erroring on the import.
module = "abb_robot_client.*"
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[tool.pixi.system-requirements]
# Released nanobind macOS ARM64 wheels target macOS 14 or newer.
macos = "14.0"

[tool.pixi.dependencies]
attrs = ">=23,<26"
hypothesis = ">=6"
invoke = ">=2"
# The released macOS nanobind wheel bundles libomp for Descartes. Pthreads
# OpenBLAS prevents NumPy from initializing a second OpenMP runtime.
libopenblas = { version = ">=0.3.30,<0.4", build = "*pthreads*" }
mypy = ">=1.11"
pybullet = "*"
pytest = ">=8"
pytest-cov = ">=5"
pytest-mock = ">=3"
pytest-xdist = ">=3"
pythonnet = ">=3"
ruff = ">=0.8"
tomlkit = "*"
twine = "*"

[tool.pixi.feature.dev.dependencies]
librsvg = "*"
python = "3.12.*"

[tool.pixi.feature.rhino.dependencies]
python = "3.9.*"

[tool.pixi.environments]
default = ["dev"]
rhino39 = ["rhino"]

[tool.pixi.pypi-dependencies]
build = "*"
# autobahn 26.6.2 (uv's default resolution, a transitive dep via abb_robot_client)
# ships a source-only sdist that fails to build on macOS / py3.12. Pin to the last
# known-good wheel release so any re-resolve stays installable.
autobahn = "==24.4.2"
compas_fab = { path = ".", editable = true }
abb_robot_client = { git = "https://github.com/jf---/abb_robot_client.git", branch = "rws2" }
compas_invocations2 = { version = ">=1.1.2,<2", extras = ["mkdocs"] }
mkdocs-print-site-plugin = "*"
pytest-testmon = ">=2"
types-PyYAML = "*"

[tool.pixi.tasks]
test = { cmd = "pytest -n auto", description = "Run tests in parallel" }
testmon = { cmd = "pytest --testmon -n auto", description = "Run affected tests in parallel" }
lint-tesseract = { cmd = "ruff check src/compas_fab/backends/tesseract tests/backends/tesseract docs/backends/tesseract/files", description = "Lint the Tesseract backend" }
format-tesseract = { cmd = "ruff format src/compas_fab/backends/tesseract tests/backends/tesseract docs/backends/tesseract/files", description = "Format the Tesseract backend" }
_typecheck-tesseract-source = { cmd = "mypy --strict src/compas_fab/backends/tesseract" }
typecheck-tesseract = { depends-on = ["_typecheck-tesseract-source"], description = "Strict type gate for the Tesseract backend source (contract test files are not strict-gated)" }
lint-abb = { cmd = "ruff check src/compas_fab/backends/abb tests/backends/abb", description = "Lint the ABB controller backend" }
format-abb = { cmd = "ruff format src/compas_fab/backends/abb tests/backends/abb", description = "Format the ABB controller backend" }
typecheck-abb = { cmd = "mypy --strict src/compas_fab/backends/abb", description = "Strict type gate for the ABB controller safety core" }
build-gh-components = { cmd = "invoke build-cpython-ghuser-components", description = "Compile CPython Grasshopper components on Windows" }
# Delegates to `invoke docs` (compas_invocations2.mkdocs) rather than calling mkdocs
# directly, because that is verbatim what compas-actions.docs@v5 runs in the `docs`
# workflow — so a local build cannot silently diverge from the deployed site.
build-docs = { cmd = "invoke docs", description = "Build the MkDocs site into dist/docs (same command CI deploys)" }
# mkdocs serve binds its own default (127.0.0.1:8000) and honours site_url, so the
# live site is served under /compas_fab/ exactly as on GitHub Pages.
serve-docs = { cmd = "mkdocs serve", description = "Serve the docs locally with live reload" }
