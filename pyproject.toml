[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Project info
# ============================================================================

[project]
name = "compas_fab"
description = "Robotic fabrication package for the COMPAS Framework"
keywords = ["robotic fabrication", "digital fabrication", "architecture", "robotics", "ros"]
authors = [
    { name = "Gramazio Kohler Research", email = "gramaziokohler@arch.ethz.ch" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dynamic = ['dependencies', 'optional-dependencies', 'version']
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.setuptools.dynamic]
version = { attr = "compas_fab.__version__.__version__" }
dependencies = { file = "requirements.txt" }
optional-dependencies = { dev = { file = "requirements-dev.txt" } }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.urdf", "*.srdf", "*.stl", "*.dae", "*.obj", "*.ghuser"]

[project.urls]
Homepage = "https://github.com/compas-dev/compas_fab"
Documentation = "https://compas.dev/compas_fab"
Repository = "https://github.com/compas-dev/compas_fab"
Changelog = "https://github.com/compas-dev/compas_fab/blob/main/CHANGELOG.md"
Issues = "https://github.com/compas-dev/compas_fab/issues"
Forum = "https://forum.compas-framework.org/"

# ============================================================================
# Testing
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_fab"]
python_files = [
    "test_*.py",
    "tests.py",
]
addopts = "-ra --strict-markers --doctest-glob=*.md --tb=short --import-mode=importlib"
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ALLOW_UNICODE ALLOW_BYTES NUMBER"
filterwarnings = "ignore::DeprecationWarning"

# ============================================================================
# Linting and formatting
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001", "E501"]
"tasks.py" = ["I001"]
"src/compas_fab/ghpython/components_cpython/*/code.py" = ["F821", "F401"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas_fab"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# Release automation
# ============================================================================

[tool.bumpversion]
current_version = "2.0.1"
message = "Bump version to {new_version}"
commit = true
tag = true
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        -                             # dash separator for pre-release section
        (?P<pre_l>[a-zA-Z-]+)         # pre-release label
        (?P<pre_n>0|[1-9]\\d*)        # pre-release version number
    )?                                # pre-release section is optional
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.pre_l]
values = ["rc", "final"]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "src/compas_fab/__version__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
glob = "src/compas_fab/ghpython/components_cpython/**/code.py"
search = "# r: compas_fab>={current_version}"
replace = "# r: compas_fab>={new_version}"

[[tool.bumpversion.files]]
glob = "src/compas_fab/ghpython/components_cpython/**/code.py"
search = "COMPAS FAB v{current_version}"
replace = "COMPAS FAB v{new_version}"

# ============================================================================
# Pixi development environment
# ============================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[tool.pixi.system-requirements]
# Released nanobind macOS ARM64 wheels target macOS 14 or newer.
macos = "14.0"

[tool.pixi.dependencies]
attrs = ">=23,<26"
invoke = ">=2"
# The released macOS nanobind wheel bundles libomp for Descartes. Pthreads
# OpenBLAS prevents NumPy from initializing a second OpenMP runtime.
libopenblas = { version = ">=0.3.30,<0.4", build = "*pthreads*" }
mypy = ">=1.11"
pybullet = "*"
pytest = ">=8"
pytest-cov = ">=5"
pytest-mock = ">=3"
pytest-xdist = ">=3"
pythonnet = ">=3"
ruff = ">=0.8"
tomlkit = "*"
twine = "*"

[tool.pixi.feature.dev.dependencies]
python = "3.12.*"

[tool.pixi.feature.rhino.dependencies]
python = "3.9.*"

[tool.pixi.environments]
default = ["dev"]
rhino39 = ["rhino"]

[tool.pixi.pypi-dependencies]
build = "*"
compas_fab = { path = ".", editable = true }
compas_invocations2 = { version = ">=1.1.2,<2", extras = ["mkdocs"] }
mkdocs-print-site-plugin = "*"
pytest-testmon = ">=2"
types-PyYAML = "*"

[tool.pixi.tasks]
test = { cmd = "pytest -n auto", description = "Run tests in parallel" }
testmon = { cmd = "pytest --testmon -n auto", description = "Run affected tests in parallel" }
lint-tesseract = { cmd = "ruff check src/compas_fab/backends/tesseract tests/backends/tesseract docs/backends/tesseract/files", description = "Lint the Tesseract backend" }
format-tesseract = { cmd = "ruff format src/compas_fab/backends/tesseract tests/backends/tesseract docs/backends/tesseract/files", description = "Format the Tesseract backend" }
typecheck-tesseract = { cmd = "mypy --strict src/compas_fab/backends/tesseract", description = "Strict type gate for the Tesseract backend" }
build-gh-components = { cmd = "invoke build-cpython-ghuser-components", description = "Compile CPython Grasshopper components on Windows" }
